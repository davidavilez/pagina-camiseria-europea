# Despliegue completo: base de datos + API + frontend (Nginx).
#   1. cp .env.example .env   (y completar los valores)
#   2. docker compose up -d --build
# La app queda en http://<IP-del-servidor> (puerto 80).

services:
  db:
    image: postgres:15
    container_name: camiseria_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:-inventario_telas}
    # Solo accesible desde la propia máquina (desarrollo local con `npm run dev`);
    # nunca expuesto a internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Solo se ejecuta cuando el volumen está vacío (primera instalación).
      - ./Backend/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    container_name: camiseria_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-inventario_telas}
      # Nginx sirve la página y reenvía /api: ambos enlaces de los correos usan la URL pública.
      CORS_ORIGIN: ${PUBLIC_URL:?Falta PUBLIC_URL en .env}
      API_URL: ${PUBLIC_URL}
      FRONTEND_URL: ${PUBLIC_URL}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      ALERTAS_STOCK_EMAIL: ${ALERTAS_STOCK_EMAIL:-}

  frontend:
    build: ./frontend
    container_name: camiseria_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

  # Solo con COMPOSE_PROFILES=https en el .env: HTTPS con Caddy en los puertos 80 y 443.
  # (El navegador del celular exige HTTPS para usar la cámara del escáner QR.)
  https:
    image: caddy:2-alpine
    container_name: camiseria_https
    profiles: ["https"]
    restart: always
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:

version: '3.8'

services:
  db:
    image: postgres:15
    container_name: camiseria_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: inventario_telas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Solo se ejecuta cuando el volumen está vacío (primera instalación).
      - ./Backend/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  pgdata: